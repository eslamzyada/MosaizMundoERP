name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    # This job name is the required status check on main — renaming it
    # silently disables branch protection until the rule is updated.
    name: Database CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mosaiz_mundo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mosaiz_mundo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: mosaiz_mundo

    steps:
      - uses: actions/checkout@v4

      # Mirrors the local role split: postgres owns objects and runs
      # migrations; mosaiz_app_user is the RLS-constrained application role.
      - name: Create application role
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE mosaiz_app_user LOGIN PASSWORD 'ci_app_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;"

      - name: Apply all migrations in order (as postgres)
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -e
          for f in db/migrations/*.sql; do
            echo "==> applying $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: RLS verification (as mosaiz_app_user)
        env:
          PGUSER: mosaiz_app_user
          PGPASSWORD: ci_app_password
        run: psql -v ON_ERROR_STOP=1 -f db/tests/rls_verification.sql

      - name: Negative checks — statements that MUST be rejected
        env:
          PGUSER: mosaiz_app_user
          PGPASSWORD: ci_app_password
        run: bash db/tests/negative_checks.sh

      # Since 0035 the app role cannot write sellable_items, so every dish a
      # later suite needs is seeded here, as postgres.
      - name: Menu fixture — seed the dishes the app role may no longer write (as postgres)
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -f db/tests/menu_fixture.sql

      - name: POS checkout verification — idempotency and isolation (as mosaiz_app_user)
        env:
          PGUSER: mosaiz_app_user
          PGPASSWORD: ci_app_password
        run: psql -v ON_ERROR_STOP=1 -f db/tests/pos_checkout_verification.sql

      - name: Inventory FIFO verification — deduction order and deficit rule (as mosaiz_app_user)
        env:
          PGUSER: mosaiz_app_user
          PGPASSWORD: ci_app_password
        run: psql -v ON_ERROR_STOP=1 -f db/tests/inventory_fifo_verification.sql

      - name: BOM integration verification — checkout draws down raw stock (as mosaiz_app_user)
        env:
          PGUSER: mosaiz_app_user
          PGPASSWORD: ci_app_password
        run: psql -v ON_ERROR_STOP=1 -f db/tests/bom_integration_verification.sql

      - name: Stocktake reconciliation verification — variance and locks (as mosaiz_app_user)
        env:
          PGUSER: mosaiz_app_user
          PGPASSWORD: ci_app_password
        run: psql -v ON_ERROR_STOP=1 -f db/tests/stocktake_concurrency_verification.sql

      - name: Admin checks — atomic rollback and FK cascade (as postgres)
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -f db/tests/admin_checks.sql

      # RBAC runs last: admin_checks asserts memberships are fully scrubbed
      # (count = 0), so this fixture must not exist before it. The fixture needs
      # the superuser because organization_memberships is deny-by-default for
      # the app role — it cannot seed a cashier for itself.
      - name: RBAC fixture — seed one member per role (as postgres)
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -f db/tests/rbac_fixture.sql

      - name: RBAC verification — role-gated writes (as mosaiz_app_user)
        env:
          PGUSER: mosaiz_app_user
          PGPASSWORD: ci_app_password
        run: psql -v ON_ERROR_STOP=1 -f db/tests/rbac_verification.sql

      # Suppliers (0020) and purchase orders (0021). The fixture seeds rows in
      # ANOTHER organization — only the superuser can, since the app role is
      # confined to its own org and cannot even see other tenants' rows — so the
      # suites below can prove the composite FKs refuse cross-tenant references.
      - name: Cross-tenant fixture — another org's supplier and ingredient (as postgres)
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -f db/tests/cross_tenant_fixture.sql

      - name: Supplier verification — attribution and role gating (as mosaiz_app_user)
        env:
          PGUSER: mosaiz_app_user
          PGPASSWORD: ci_app_password
        run: psql -v ON_ERROR_STOP=1 -f db/tests/supplier_verification.sql

      # Purchase orders (0021) build on the supplier the previous suite created.
      - name: Purchase order verification — receiving and shortfalls (as mosaiz_app_user)
        env:
          PGUSER: mosaiz_app_user
          PGPASSWORD: ci_app_password
        run: psql -v ON_ERROR_STOP=1 -f db/tests/purchase_order_verification.sql

      # Cost of goods sold (0015). Seeded as postgres for the same reason as the
      # RBAC fixture, then asserted as a CASHIER — checkout is SECURITY INVOKER
      # and that is the role that runs it in production.
      - name: COGS fixture — stock split across two priced lots (as postgres)
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -f db/tests/cogs_fixture.sql

      - name: COGS verification — cost captured at checkout (as mosaiz_app_user)
        env:
          PGUSER: mosaiz_app_user
          PGPASSWORD: ci_app_password
        run: psql -v ON_ERROR_STOP=1 -f db/tests/cogs_verification.sql

      # Void (0018) reuses the COGS orders, whose consumption is known exactly,
      # so the restore arithmetic is pinned to the unit. Runs as the app user,
      # switching between the fixture's cashier (must be refused) and manager.
      - name: Void verification — status, restore, and refusals (as mosaiz_app_user)
        env:
          PGUSER: mosaiz_app_user
          PGPASSWORD: ci_app_password
        run: psql -v ON_ERROR_STOP=1 -f db/tests/void_verification.sql

      # Must follow void_verification: the write-off arithmetic is pinned to the
      # stock levels the voids leave behind (patty back to 15, cheese at 94).
      - name: Write-off verification — FIFO, named lots, and the reason gate (as mosaiz_app_user)
        env:
          PGUSER: mosaiz_app_user
          PGPASSWORD: ci_app_password
        run: psql -v ON_ERROR_STOP=1 -f db/tests/write_off_verification.sql

      # Must follow write_off_verification: the "has history" ingredient it
      # refuses to delete is the one the write-offs and sales gave a history to.
      - name: Ingredient lifecycle verification — delete, archive, cost correction (as mosaiz_app_user)
        env:
          PGUSER: mosaiz_app_user
          PGPASSWORD: ci_app_password
        run: psql -v ON_ERROR_STOP=1 -f db/tests/ingredient_lifecycle_verification.sql

      # The per-unit cost columns hold a RATE (currency per gram), not a currency
      # amount. At numeric(10,2) a 250.00 delivery of 8000 g valued at 240.00.
      - name: Cost precision verification — rates and the recorded bill (as mosaiz_app_user)
        env:
          PGUSER: mosaiz_app_user
          PGPASSWORD: ci_app_password
        run: psql -v ON_ERROR_STOP=1 -f db/tests/cost_precision_verification.sql

      # Who rang up each sale (0026). Runs late: it makes new sales, and the
      # earlier suites pin exact stock levels that new sales would move.
      - name: Sale attribution verification — who served, and who did not (as mosaiz_app_user)
        env:
          PGUSER: mosaiz_app_user
          PGPASSWORD: ci_app_password
        run: psql -v ON_ERROR_STOP=1 -f db/tests/sale_attribution_verification.sql

      # Ratings (0027). The only table here where SELECT is gated, so the suite
      # asserts a cashier reads NOTHING — including their own rating.
      - name: Employee rating verification — read gate and month lock (as mosaiz_app_user)
        env:
          PGUSER: mosaiz_app_user
          PGPASSWORD: ci_app_password
        run: psql -v ON_ERROR_STOP=1 -f db/tests/employee_rating_verification.sql

      # The rubric behind the rating (0033). Runs after the cogs and cross-tenant
      # fixtures because it needs a second identity and a second organization —
      # the two things the early negative checks cannot reach.
      - name: Rating criteria verification — the read split and the composite key (as mosaiz_app_user)
        env:
          PGUSER: mosaiz_app_user
          PGPASSWORD: ci_app_password
        run: psql -v ON_ERROR_STOP=1 -f db/tests/rating_criteria_verification.sql

      # The two roles the floor actually has (0034).
      - name: Floor roles fixture — a waiter, a kitchen and a manager (as postgres)
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -f db/tests/floor_roles_fixture.sql

      - name: Floor roles verification — the waiter sells, the kitchen reads (as mosaiz_app_user)
        env:
          PGUSER: mosaiz_app_user
          PGPASSWORD: ci_app_password
        run: psql -v ON_ERROR_STOP=1 -f db/tests/floor_roles_verification.sql

      # The menu approval cycle (0035). Runs after the floor fixture because it
      # needs the two roles that decide and the two that propose.
      - name: Menu change verification — the cycle, and the closed direct path (as mosaiz_app_user)
        env:
          PGUSER: mosaiz_app_user
          PGPASSWORD: ci_app_password
        run: psql -v ON_ERROR_STOP=1 -f db/tests/menu_change_verification.sql

      # Notifications (0036). After the menu cycle, because the two events it
      # delivers are that cycle's.
      - name: Notification verification — delivery, and who cannot send (as mosaiz_app_user)
        env:
          PGUSER: mosaiz_app_user
          PGPASSWORD: ci_app_password
        run: psql -v ON_ERROR_STOP=1 -f db/tests/notification_verification.sql

      # The link constraint (0051). Runs as postgres, because this is a CHECK
      # and not an RLS question: it must hold for every writer, which is the
      # reason the rule moved here from the admin app.
      - name: Internal-link verification — a notification cannot carry somebody off-site
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -f db/tests/internal_link_verification.sql

      # The plan matrix in the docs is the closest thing this project has to a
      # price list, and it went stale without anybody noticing: labour,
      # reservations and public_ordering shipped, were given real min_plan
      # values by 0044, and never appeared in the table.
      #
      # Runs against the freshly migrated database, so it compares the docs
      # with what the migrations actually did rather than with each other.
      - name: Plan matrix matches the modules table
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
        run: node scripts/plan-matrix-check.mjs

      # Per-tenant modules (0037). Last, because it switches capabilities off
      # and on for the floor fixture's organization — every suite that depends
      # on those capabilities has already run.
      - name: Module verification — off refuses writes, and changes no history (as mosaiz_app_user)
        env:
          PGUSER: mosaiz_app_user
          PGPASSWORD: ci_app_password
        run: psql -v ON_ERROR_STOP=1 -f db/tests/module_verification.sql

      # Labour (0038). After the module suite, because the labour module ships
      # switched off and this suite turns it on with app.set_module.
      - name: Labour verification — nobody writes their own hours (as mosaiz_app_user)
        env:
          PGUSER: mosaiz_app_user
          PGPASSWORD: ci_app_password
        run: psql -v ON_ERROR_STOP=1 -f db/tests/labour_verification.sql

      # Tables and bookings (0039). Also switched off by default, so this suite
      # turns it on the same way.
      - name: Reservation verification — one table, one party, one time (as mosaiz_app_user)
        env:
          PGUSER: mosaiz_app_user
          PGPASSWORD: ci_app_password
        run: psql -v ON_ERROR_STOP=1 -f db/tests/reservation_verification.sql

      # Public ordering (0040). The only surface a stranger can reach, so this
      # suite spends most of its length on what an anonymous caller CANNOT do.
      - name: Public ordering verification — the customer cannot set a price (as mosaiz_app_user)
        env:
          PGUSER: mosaiz_app_user
          PGPASSWORD: ci_app_password
        run: psql -v ON_ERROR_STOP=1 -f db/tests/public_ordering_verification.sql

      # Notifications for the queues 0038-0040 created (0041). Last, because it
      # asserts against inboxes the suites above have been filling.
      - name: Queue notifications — who is told, and who is left alone (as mosaiz_app_user)
        env:
          PGUSER: mosaiz_app_user
          PGPASSWORD: ci_app_password
        run: psql -v ON_ERROR_STOP=1 -f db/tests/notify_queues_verification.sql

      # Pay (0042). The confidentiality assertions are the point: a branch
      # manager may write the rota and still may not read what it costs.
      - name: Wages verification — history does not move, and pay is private (as mosaiz_app_user)
        env:
          PGUSER: mosaiz_app_user
          PGPASSWORD: ci_app_password
        run: psql -v ON_ERROR_STOP=1 -f db/tests/wages_verification.sql

      # Seating (0043). Last: it walks the full tab lifecycle — open, add, fire,
      # settle — so it depends on the menu the suites above have built.
      - name: Seating verification — one open tab per table (as mosaiz_app_user)
        env:
          PGUSER: mosaiz_app_user
          PGPASSWORD: ci_app_password
        run: psql -v ON_ERROR_STOP=1 -f db/tests/seating_verification.sql

      # 0045. 0043 gave orders a table; until now only the admin ever set one.
      - name: Open tab at a table — the till reaches the floor plan (as mosaiz_app_user)
        env:
          PGUSER: mosaiz_app_user
          PGPASSWORD: ci_app_password
        run: psql -v ON_ERROR_STOP=1 -f db/tests/open_tab_table_verification.sql

      # 0046. Forty-five migrations recorded what was sold and nothing about
      # the money that came back.
      - name: Payment verification — the tender, and what unspecified means (as mosaiz_app_user)
        env:
          PGUSER: mosaiz_app_user
          PGPASSWORD: ci_app_password
        run: psql -v ON_ERROR_STOP=1 -f db/tests/payment_verification.sql

      # 0047. The number a restaurant produces about itself every night.
      - name: Till session verification — does the drawer balance (as mosaiz_app_user)
        env:
          PGUSER: mosaiz_app_user
          PGPASSWORD: ci_app_password
        run: psql -v ON_ERROR_STOP=1 -f db/tests/till_session_verification.sql

      # 0048. Since 0001 any member could rename or DELETE their restaurant.
      - name: Organization settings — who may change what the restaurant is (as mosaiz_app_user)
        env:
          PGUSER: mosaiz_app_user
          PGPASSWORD: ci_app_password
        run: psql -v ON_ERROR_STOP=1 -f db/tests/organization_settings_verification.sql

      # Plans (0044). The app-role half first: the ceiling, and the three
      # routes by which a tenant must not be able to promote itself.
      - name: Plan verification — the ceiling, from inside a tenant (as mosaiz_app_user)
        env:
          PGUSER: mosaiz_app_user
          PGPASSWORD: ci_app_password
        run: psql -v ON_ERROR_STOP=1 -f db/tests/plan_verification.sql

      # And the operator half. app.change_plan is deliberately not granted to
      # the app role, so this is the only side it can be exercised from.
      - name: Plan admin verification — upgrades, downgrades and what survives (as postgres)
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -f db/tests/plan_admin_verification.sql

      # Order and line comments (0028). Also the regression guard for the
      # checkout procedure, which 0028 replaces wholesale to add two fields.
      - name: Order comment verification — notes, and attribution still intact (as mosaiz_app_user)
        env:
          PGUSER: mosaiz_app_user
          PGPASSWORD: ci_app_password
        run: psql -v ON_ERROR_STOP=1 -f db/tests/order_comment_verification.sql

      # Open tabs (0029). The assertion that matters most is that an open order
      # never reaches a revenue figure — otherwise every table still eating
      # inflates the day's takings.
      - name: Open order verification — tab lifecycle, stock at fire, cancellation (as mosaiz_app_user)
        env:
          PGUSER: mosaiz_app_user
          PGPASSWORD: ci_app_password
        run: psql -v ON_ERROR_STOP=1 -f db/tests/open_order_verification.sql

      # Printers (0031). The rule under test fails SILENTLY: two active kitchen
      # printers means a till picks one arbitrarily and tickets vanish to a
      # machine nobody is watching.
      - name: Printer verification — one active per role, admin-only (as mosaiz_app_user)
        env:
          PGUSER: mosaiz_app_user
          PGPASSWORD: ci_app_password
        run: psql -v ON_ERROR_STOP=1 -f db/tests/printer_verification.sql

      # Preferences (0032). The assertion that matters is that a preference is
      # PRIVATE: the org policy alone would let every colleague read and rewrite
      # your settings, and nothing on screen would ever show it happening.
      - name: Preferences verification — private settings, shared branding (as mosaiz_app_user)
        env:
          PGUSER: mosaiz_app_user
          PGPASSWORD: ci_app_password
        run: psql -v ON_ERROR_STOP=1 -f db/tests/preferences_verification.sql

      # ---- API integration tests against the migrated container DB ----------
      # The app connects as the RLS-constrained mosaiz_app_user; the test
      # harness seeds/tears down via the postgres superuser (ADMIN_DATABASE_URL).
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # The committed schema.prisma is introspected from the database, but the
      # "Backend Build" job generates from that committed file with NO database,
      # so it cannot notice when the two have diverged. That is how the schema
      # went stale for two migrations after 0013. This step is the missing
      # check: re-introspect the freshly migrated database and fail if the
      # result differs from what is committed.
      #
      # Reads as the superuser: introspection must see every table, and RLS
      # would hide rows (though not structure) from the app role.
      - name: Prisma schema matches the migrated database
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/mosaiz_mundo"
        run: |
          npm run db:pull
          if ! git diff --exit-code --stat -- prisma/schema.prisma; then
            echo ""
            echo "::error file=backend/prisma/schema.prisma::prisma/schema.prisma is out of date with the migrations."
            echo "The database and the committed Prisma schema disagree. After adding a migration, run:"
            echo "    cd backend && npm run db:pull && npm run build"
            echo "and commit the regenerated prisma/schema.prisma. Full diff:"
            echo ""
            git --no-pager diff -- prisma/schema.prisma
            exit 1
          fi
          echo "prisma/schema.prisma is in step with the database."

      # The void vocabulary (0022) necessarily lives in two places — a CHECK
      # constraint and a TypeScript constant the API validates against — so
      # something has to compare them. Left unchecked, a reason could be added
      # to one and not the other, and the mismatch would surface at the till as
      # an unexplained error on a correction someone is waiting to make.
      #
      # Run here because this is the only job with a freshly migrated database.
      # The suite needs no JWT secret: it reads pg_constraint and nothing else.
      - name: Void reason vocabulary matches the database
        working-directory: backend
        env:
          ADMIN_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/mosaiz_mundo"
        run: npx jest src/__tests__/voidReasons.drift.test.ts --runInBand --forceExit

      - name: Build backend
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://mosaiz_app_user:ci_app_password@localhost:5432/mosaiz_mundo"
        run: npm run build

      - name: API integration tests (Jest + supertest)
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://mosaiz_app_user:ci_app_password@localhost:5432/mosaiz_mundo"
          ADMIN_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/mosaiz_mundo"
          SUPABASE_JWT_SECRET: "ci-test-jwt-secret-at-least-32-characters-long"
          SUPABASE_WEBHOOK_SECRET: "ci-test-webhook-secret-at-least-32-chars-long"
        run: npm test

  backend:
    # Compiles the API gateway. Prisma Client is generated from the committed,
    # introspected schema.prisma — no database is needed at build time, so a
    # placeholder DATABASE_URL is enough for `prisma generate` to resolve the
    # datasource env without connecting.
    name: Backend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build (prisma generate + tsc)
        run: npm run build

      # A supply-chain gate that somebody will actually trust.
      #
      # Plain `npm audit` exits non-zero on anything, so it exits non-zero
      # always, so it acquires an `|| true` and stops meaning anything. This
      # asks the narrower question: has a HIGH or CRITICAL advisory appeared in
      # a dependency that SHIPS, which nobody has looked at yet?
      #
      # Everything else — moderates, and the whole dev toolchain, which does not
      # ship — is printed and does not fail. Blocking a till fix on a bundler
      # advisory published this morning is how a check gets switched off.
      #
      # Runs from the repo root because it reads one shared review file.
      - name: Shipping dependencies have no unreviewed advisories
        working-directory: .
        run: node scripts/audit-gate.mjs backend clients/admin

      # A Dockerfile nobody builds is a Dockerfile that has already broken. The
      # same argument this repo made for the backend suite: if it is not
      # checked here, it is checked by whoever next tries to deploy.
      #
      # Build only, no push. This proves the multi-stage build still compiles,
      # that --omit=dev leaves the runtime able to start, and that the Prisma
      # client copied out of the build stage is where the runtime expects it.
      - name: Container image builds
        run: docker build -t mosaiz-api:ci .

      # ...and that it actually starts and refuses a bad configuration. `docker
      # build` proves the image assembles, not that the thing inside it runs —
      # an image whose CMD dies immediately still builds perfectly.
      #
      # No database here: this asserts the BOOT GATE, which must exit 78 and
      # name what is missing rather than start and answer 500 on every request.
      - name: Container refuses to start unconfigured
        run: |
          set +e
          output=$(docker run --rm -e NODE_ENV=production mosaiz-api:ci 2>&1)
          code=$?
          set -e
          echo "$output"
          if [ "$code" -ne 78 ]; then
            echo "::error::expected exit 78 (EX_CONFIG) from an unconfigured container, got $code"
            exit 1
          fi
          echo "$output" | grep -q "DATABASE_URL" || {
            echo "::error::the refusal did not name DATABASE_URL"; exit 1; }
          echo "Refused to start, exit 78, naming what was missing."

  backend-tests:
    # Runs the API gateway's Jest suite against a real, freshly migrated
    # database. Until this job existed, "Backend Build" only compiled and
    # "Database CI" only exercised raw SQL — the ~200 integration tests that
    # drive the HTTP handlers through RLS ran on contributors' machines and
    # NOWHERE ELSE. Every phase for months shipped on "passes locally", which is
    # not a check. This is that check.
    #
    # Its own postgres service, deliberately separate from the Database CI job:
    # that job loads the db/tests fixtures (rbac, cogs, cross-tenant seeds), and
    # these tests assume a database that contains only what each suite seeds and
    # tears down itself. A clean instance is also the honest question — "does the
    # suite pass from nothing?" — which is exactly what a new contributor's
    # checkout faces.
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mosaiz_mundo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mosaiz_mundo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: mosaiz_mundo

    steps:
      - uses: actions/checkout@v4

      # Same role split the migrations and the Database CI job assume: postgres
      # owns objects and runs DDL; mosaiz_app_user is the RLS-constrained login
      # the API connects as. The tests seed as postgres (ADMIN_DATABASE_URL) and
      # drive the handlers as mosaiz_app_user (DATABASE_URL), so both must exist.
      - name: Create application role
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE mosaiz_app_user LOGIN PASSWORD 'ci_app_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;"

      - name: Apply all migrations in order (as postgres)
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -e
          for f in db/migrations/*.sql; do
            echo "==> applying $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # Generates the Prisma Client the tests import, and type-checks in the
      # same pass. ts-jest transpiles the tests themselves, so tsc is not
      # strictly required to run them — but building here fails fast on a type
      # error instead of surfacing it as a confusing runtime fault mid-suite.
      - name: Build (prisma generate + tsc)
        working-directory: backend
        run: npm run build

      # The two "secrets" below are NOT real credentials and must never be.
      # SUPABASE_JWT_SECRET is the HS256 key the tests sign their own tokens with
      # and the middleware verifies them against — a self-contained loopback that
      # authenticates against nothing outside this process. (Real Supabase signs
      # with ES256; the auth.es256 suite generates its own keypair and injects
      # the public key at runtime.) SUPABASE_WEBHOOK_SECRET is likewise the HMAC
      # key the webhook suite both signs and verifies with. Hardcoding them here
      # is correct: a repository secret would imply they gate something real.
      - name: Jest integration suite (against the migrated database)
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://mosaiz_app_user:ci_app_password@localhost:5432/mosaiz_mundo"
          ADMIN_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/mosaiz_mundo"
          SUPABASE_JWT_SECRET: "ci_only_hs256_test_secret_not_a_real_credential"
          SUPABASE_WEBHOOK_SECRET: "ci_only_webhook_test_secret_not_a_real_credential"
        run: npm test

  admin-frontend:
    # Compiles the React admin dashboard (Vite + TypeScript). Mock-first, so no
    # database or backend is needed — a plain type-check + production build.
    name: Admin Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: clients/admin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: clients/admin/package-lock.json

      - name: Install dependencies
        run: npm install

      # The admin had no runtime tests until now, which is how a blank screen,
      # a status the UI did not recognise and a hidden ratings panel all reached
      # a real device with this job green: tsc only ever checked types, and API
      # responses are cast rather than validated, so the types could be wrong
      # and still compile.
      - name: Admin unit tests
        run: npm test

      - name: Build (tsc + vite build)
        run: npm run build

  android-pos:
    # Builds the Kotlin/Compose POS client. The ubuntu runner ships the Android
    # SDK (platform-34 + build-tools) preinstalled; setup-gradle provides Gradle
    # 8.7 (the wrapper jar is not committed, so we use a global Gradle install).
    name: Android POS Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # The ESC/POS encoder, the ticket content and the socket transport are
      # deliberately free of Android types so they run here, on the JVM. The
      # byte stream is the part of printing where a mistake produces a metre of
      # garbage rather than a ticket, and nothing downstream would catch it.
      - name: POS unit tests
        working-directory: clients/pos
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APK
        working-directory: clients/pos
        run: gradle assembleDebug --no-daemon --stacktrace
