name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    # This job name is the required status check on main — renaming it
    # silently disables branch protection until the rule is updated.
    name: Database CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mosaiz_mundo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mosaiz_mundo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: mosaiz_mundo

    steps:
      - uses: actions/checkout@v4

      # Mirrors the local role split: postgres owns objects and runs
      # migrations; mosaiz_app_user is the RLS-constrained application role.
      - name: Create application role
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE mosaiz_app_user LOGIN PASSWORD 'ci_app_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;"

      - name: Apply all migrations in order (as postgres)
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -e
          for f in db/migrations/*.sql; do
            echo "==> applying $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: RLS verification (as mosaiz_app_user)
        env:
          PGUSER: mosaiz_app_user
          PGPASSWORD: ci_app_password
        run: psql -v ON_ERROR_STOP=1 -f db/tests/rls_verification.sql

      - name: Negative checks — statements that MUST be rejected
        env:
          PGUSER: mosaiz_app_user
          PGPASSWORD: ci_app_password
        run: bash db/tests/negative_checks.sh

      - name: POS checkout verification — idempotency and isolation (as mosaiz_app_user)
        env:
          PGUSER: mosaiz_app_user
          PGPASSWORD: ci_app_password
        run: psql -v ON_ERROR_STOP=1 -f db/tests/pos_checkout_verification.sql

      - name: Inventory FIFO verification — deduction order and deficit rule (as mosaiz_app_user)
        env:
          PGUSER: mosaiz_app_user
          PGPASSWORD: ci_app_password
        run: psql -v ON_ERROR_STOP=1 -f db/tests/inventory_fifo_verification.sql

      - name: BOM integration verification — checkout draws down raw stock (as mosaiz_app_user)
        env:
          PGUSER: mosaiz_app_user
          PGPASSWORD: ci_app_password
        run: psql -v ON_ERROR_STOP=1 -f db/tests/bom_integration_verification.sql

      - name: Stocktake reconciliation verification — variance and locks (as mosaiz_app_user)
        env:
          PGUSER: mosaiz_app_user
          PGPASSWORD: ci_app_password
        run: psql -v ON_ERROR_STOP=1 -f db/tests/stocktake_concurrency_verification.sql

      - name: Admin checks — atomic rollback and FK cascade (as postgres)
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -f db/tests/admin_checks.sql

      # RBAC runs last: admin_checks asserts memberships are fully scrubbed
      # (count = 0), so this fixture must not exist before it. The fixture needs
      # the superuser because organization_memberships is deny-by-default for
      # the app role — it cannot seed a cashier for itself.
      - name: RBAC fixture — seed one member per role (as postgres)
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -f db/tests/rbac_fixture.sql

      - name: RBAC verification — role-gated writes (as mosaiz_app_user)
        env:
          PGUSER: mosaiz_app_user
          PGPASSWORD: ci_app_password
        run: psql -v ON_ERROR_STOP=1 -f db/tests/rbac_verification.sql

      # Suppliers (0020) and purchase orders (0021). The fixture seeds rows in
      # ANOTHER organization — only the superuser can, since the app role is
      # confined to its own org and cannot even see other tenants' rows — so the
      # suites below can prove the composite FKs refuse cross-tenant references.
      - name: Cross-tenant fixture — another org's supplier and ingredient (as postgres)
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -f db/tests/cross_tenant_fixture.sql

      - name: Supplier verification — attribution and role gating (as mosaiz_app_user)
        env:
          PGUSER: mosaiz_app_user
          PGPASSWORD: ci_app_password
        run: psql -v ON_ERROR_STOP=1 -f db/tests/supplier_verification.sql

      # Purchase orders (0021) build on the supplier the previous suite created.
      - name: Purchase order verification — receiving and shortfalls (as mosaiz_app_user)
        env:
          PGUSER: mosaiz_app_user
          PGPASSWORD: ci_app_password
        run: psql -v ON_ERROR_STOP=1 -f db/tests/purchase_order_verification.sql

      # Cost of goods sold (0015). Seeded as postgres for the same reason as the
      # RBAC fixture, then asserted as a CASHIER — checkout is SECURITY INVOKER
      # and that is the role that runs it in production.
      - name: COGS fixture — stock split across two priced lots (as postgres)
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -f db/tests/cogs_fixture.sql

      - name: COGS verification — cost captured at checkout (as mosaiz_app_user)
        env:
          PGUSER: mosaiz_app_user
          PGPASSWORD: ci_app_password
        run: psql -v ON_ERROR_STOP=1 -f db/tests/cogs_verification.sql

      # Void (0018) reuses the COGS orders, whose consumption is known exactly,
      # so the restore arithmetic is pinned to the unit. Runs as the app user,
      # switching between the fixture's cashier (must be refused) and manager.
      - name: Void verification — status, restore, and refusals (as mosaiz_app_user)
        env:
          PGUSER: mosaiz_app_user
          PGPASSWORD: ci_app_password
        run: psql -v ON_ERROR_STOP=1 -f db/tests/void_verification.sql

      # ---- API integration tests against the migrated container DB ----------
      # The app connects as the RLS-constrained mosaiz_app_user; the test
      # harness seeds/tears down via the postgres superuser (ADMIN_DATABASE_URL).
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # The committed schema.prisma is introspected from the database, but the
      # "Backend Build" job generates from that committed file with NO database,
      # so it cannot notice when the two have diverged. That is how the schema
      # went stale for two migrations after 0013. This step is the missing
      # check: re-introspect the freshly migrated database and fail if the
      # result differs from what is committed.
      #
      # Reads as the superuser: introspection must see every table, and RLS
      # would hide rows (though not structure) from the app role.
      - name: Prisma schema matches the migrated database
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/mosaiz_mundo"
        run: |
          npm run db:pull
          if ! git diff --exit-code --stat -- prisma/schema.prisma; then
            echo ""
            echo "::error file=backend/prisma/schema.prisma::prisma/schema.prisma is out of date with the migrations."
            echo "The database and the committed Prisma schema disagree. After adding a migration, run:"
            echo "    cd backend && npm run db:pull && npm run build"
            echo "and commit the regenerated prisma/schema.prisma. Full diff:"
            echo ""
            git --no-pager diff -- prisma/schema.prisma
            exit 1
          fi
          echo "prisma/schema.prisma is in step with the database."

      - name: Build backend
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://mosaiz_app_user:ci_app_password@localhost:5432/mosaiz_mundo"
        run: npm run build

      - name: API integration tests (Jest + supertest)
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://mosaiz_app_user:ci_app_password@localhost:5432/mosaiz_mundo"
          ADMIN_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/mosaiz_mundo"
          SUPABASE_JWT_SECRET: "ci-test-jwt-secret-at-least-32-characters-long"
          SUPABASE_WEBHOOK_SECRET: "ci-test-webhook-secret-at-least-32-chars-long"
        run: npm test

  backend:
    # Compiles the API gateway. Prisma Client is generated from the committed,
    # introspected schema.prisma — no database is needed at build time, so a
    # placeholder DATABASE_URL is enough for `prisma generate` to resolve the
    # datasource env without connecting.
    name: Backend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build (prisma generate + tsc)
        run: npm run build

  admin-frontend:
    # Compiles the React admin dashboard (Vite + TypeScript). Mock-first, so no
    # database or backend is needed — a plain type-check + production build.
    name: Admin Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: clients/admin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: clients/admin/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build (tsc + vite build)
        run: npm run build

  android-pos:
    # Builds the Kotlin/Compose POS client. The ubuntu runner ships the Android
    # SDK (platform-34 + build-tools) preinstalled; setup-gradle provides Gradle
    # 8.7 (the wrapper jar is not committed, so we use a global Gradle install).
    name: Android POS Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Assemble debug APK
        working-directory: clients/pos
        run: gradle assembleDebug --no-daemon --stacktrace
